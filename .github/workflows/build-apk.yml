name: Build Lux Finance APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LuxFinanceApp.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ekstrak proyek
        run: unzip LuxFinanceApp.zip

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        run: gradle --no-daemon -p LuxFinanceApp :app:assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxFinance-debug-APK
          path: LuxFinanceApp/app/build/outputs/apk/debug/app-debug.apk
